{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Real Estate</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="success-container">
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>Payment Successful!</h1>
        <p>Your payment has been processed successfully. Thank you for your transaction.</p>
        <div class="success-actions">
            <a href="{% url 'payments:my_payments' %}" class="btn btn-primary">
                View Payment History
            </a>
            <a href="{% url 'properties:property_list' %}" class="btn btn-outline">
                Browse More Properties
            </a>
        </div>
    </div>
</div>

<style>
    .success-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 2rem;
    }

    .success-card {
        text-align: center;
        background: white;
        padding: 3rem;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        max-width: 500px;
        width: 100%;
    }

    .success-icon {
        font-size: 4rem;
        color: var(--success);
        margin-bottom: 1.5rem;
    }

    .success-card h1 {
        margin-bottom: 1rem;
        color: var(--text-primary);
    }

    .success-card p {
        color: var(--text-secondary);
        margin-bottom: 2rem;
        font-size: 1.1rem;
    }

    .success-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }
</style>
{% endblock %}
