{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed - Real Estate</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-times-circle"></i>
        </div>
        <h1>Payment Failed</h1>
        <p>We're sorry, but your payment could not be processed. Please try again.</p>
        <div class="error-actions">
            <a href="{% url 'properties:property_list' %}" class="btn btn-primary">
                Try Again
            </a>
            <a href="{% url 'dashboard' %}" class="btn btn-outline">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>

<style>
    .error-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 2rem;
    }

    .error-card {
        text-align: center;
        background: white;
        padding: 3rem;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        max-width: 500px;
        width: 100%;
    }

    .error-icon {
        font-size: 4rem;
        color: var(--danger);
        margin-bottom: 1.5rem;
    }

    .error-card h1 {
        margin-bottom: 1rem;
        color: var(--text-primary);
    }

    .error-card p {
        color: var(--text-secondary);
        margin-bottom: 2rem;
        font-size: 1.1rem;
    }

    .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }
</style>
{% endblock %}
