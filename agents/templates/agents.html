{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agents - Real Estate CRM</title>

    <!-- Link CSS from static folder -->
    <link rel="stylesheet" href="{% static 'agents/style.css' %}">
    <link rel="stylesheet" href="{% static 'agents/dashboard.css' %}">

    <!-- Fonts and icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app_container">
        <!--Sidebar-->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Real Estate CRM</h2>
            </div>

            <nav class="sidebar-nav">
                <ul>
 
    <li><a href="{% url 'properties' %}"><i class="fas fa-building"></i><span> Properties</span></a></li>
    <li><a href="{% url 'clients' %}"><i class="fas fa-users"></i><span> Clients</span></a></li>
    <li class="active"><a href="{% url 'agent_list' %}"><i class="fas fa-user-tie"></i><span> Agents</span></a></li>
</ul>

            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!--Main content-->
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <h1>Agents</h1>
                    <p>Manage your real estate agents</p>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="agentSearchHeader" placeholder="Search agents...">
                    </div>
                    <button class="btn btn-primary" id="addAgentBtn">
                        <i class="fas fa-plus"></i>
                        <span>Add Agent</span>
                    </button>
                </div>
            </header>

            <div class="dashboard-content">
                <!--Stats Card-->
                <div class="stats-grid">
                    <div class="card stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Agents</h3>
                            <p class="stat-value" id="totalAgents">0</p>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-handshake"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Active Deals</h3>
                            <p class="stat-value" id="activeDeals">0</p>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Sales</h3>
                            <p class="stat-value" id="totalSales">$0</p>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Top Performers</h3>
                            <p class="stat-value" id="topPerformers">0</p>
                        </div>
                    </div>
                </div>

                <div class="agents-content">
                    <div class="filters-section">
                        <div class="filter-group">
                            <label for="agentSearch">Search Agents</label>
                            <input type="text" id="agentSearch" placeholder="Search by name or email...">
                        </div>
                        <div class="filter-group">
                            <label for="agentStatus">Status</label>
                            <select id="agentStatus">
                                <option value="all">All Statuses</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="vacation">Vacation</option>
                                <option value="training">Training</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="agentSpecialization">Specialization</label>
                            <select id="agentSpecialization">
                                <option value="all">All Specializations</option>
                                <option value="residential">Residential</option>
                                <option value="commercial">Commercial</option>
                                <option value="luxury">Luxury</option>
                            </select>
                        </div>
                        <button id="clearFilters" class="btn btn-secondary">
                            <i class="fas fa-times"></i>
                            <span>Clear Filters</span>
                        </button>
                        <button id="addAgentBtn" class="btn btn-success">Add New Agent</button>

<div id="addAgentModal" style="display:none;">
    <h2>Add New Agent</h2>
    <form method="POST" action="{% url 'agent_list' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Agent</button>
    </form>
</div>

<script>
const modal = document.getElementById("addAgentModal");
const btn = document.getElementById("addAgentBtn");

btn.onclick = function() {
    modal.style.display = "block";
}
</script>

                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
